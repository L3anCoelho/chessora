name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # O postinstall copia o motor Stockfish para public/engine.
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Valores públicos (ficam visíveis no navegador). Cadastre em Settings > Secrets and variables > Actions.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CHECKOUT_URL: ${{ secrets.VITE_CHECKOUT_URL }}
          VITE_CHECKOUT_REF_PARAM: ${{ secrets.VITE_CHECKOUT_REF_PARAM }}
          VITE_EBOOK_PRICE_CENTS: ${{ secrets.VITE_EBOOK_PRICE_CENTS }}
      # GitHub Pages não tem fallback de SPA: o 404.html reaproveita o app para links diretos (ex.: /chessora/jogar).
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
